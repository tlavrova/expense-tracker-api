[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "A small expense tracker API, built test-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["expense_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -m 'not external'"
markers = [
    "integration: uses the database or the API (slower than unit tests)",
    "slow: takes noticeably longer than the rest",
    "external: calls a real network service; skipped unless selected with -m external",
]
